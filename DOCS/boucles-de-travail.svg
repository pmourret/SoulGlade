<svg xmlns="http://www.w3.org/2000/svg" width="680" height="505" viewBox="0 0 680 505" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Soulglade — les deux boucles de travail</title>
<desc id="dsc">Une boucle d'iteration en cinq etapes (cadrage ecrit, travail, definition de fini, retro, mise a jour du tableau de bord) qui contient une boucle de session en trois etapes (ouverture, travail borne, fermeture). Une idee qui arrive en cours de route va a l'horizon, jamais en a faire.</desc>

<style>
  :root{
    --txt:#3d3d3a; --line:#73726c;
    --p-fill:#EEEDFE; --p-line:#534AB7; --p-ttl:#3C3489; --p-sub:#534AB7;
    --t-fill:#E1F5EE; --t-line:#0F6E56; --t-ttl:#085041; --t-sub:#0F6E56;
    --a-fill:#FAEEDA; --a-line:#854F0B; --a-ttl:#633806; --a-sub:#854F0B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --txt:#c2c0b6; --line:#9c9a92;
      --p-fill:#3C3489; --p-line:#AFA9EC; --p-ttl:#CECBF6; --p-sub:#AFA9EC;
      --t-fill:#085041; --t-line:#5DCAA5; --t-ttl:#9FE1CB; --t-sub:#5DCAA5;
      --a-fill:#633806; --a-line:#EF9F27; --a-ttl:#FAC775; --a-sub:#EF9F27;
    }
  }
  text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  .th{font-size:14px;font-weight:500;fill:var(--txt)}
  .ts{font-size:12px;font-weight:400;fill:var(--txt)}
  .arr{stroke:var(--line);stroke-width:1.5;fill:none}
  .leader{stroke:var(--line);stroke-width:0.5;stroke-dasharray:3 3;fill:none}
  .frame{fill:none;stroke:var(--line);stroke-width:0.5;stroke-dasharray:4 4}
  .p rect{fill:var(--p-fill);stroke:var(--p-line);stroke-width:0.5}
  .p .th{fill:var(--p-ttl)} .p .ts{fill:var(--p-sub)}
  .t rect{fill:var(--t-fill);stroke:var(--t-line);stroke-width:0.5}
  .t .th{fill:var(--t-ttl)} .t .ts{fill:var(--t-sub)}
  .a rect{fill:var(--a-fill);stroke:var(--a-line);stroke-width:0.5}
  .a .th{fill:var(--a-ttl)} .a .ts{fill:var(--a-sub)}
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="40" y="28">Boucle d'itération</text>

<g class="p">
  <rect x="40" y="45" width="220" height="56" rx="8"/>
  <text class="th" x="150" y="66" text-anchor="middle" dominant-baseline="central">Cadrage écrit</text>
  <text class="ts" x="150" y="84" text-anchor="middle" dominant-baseline="central">avant la première ligne</text>
</g>
<line x1="150" y1="101" x2="150" y2="127" class="arr" marker-end="url(#arrow)"/>

<g class="p">
  <rect x="40" y="135" width="220" height="56" rx="8"/>
  <text class="th" x="150" y="156" text-anchor="middle" dominant-baseline="central">Travail</text>
  <text class="ts" x="150" y="174" text-anchor="middle" dominant-baseline="central">une seule itération ouverte</text>
</g>
<line x1="150" y1="191" x2="150" y2="217" class="arr" marker-end="url(#arrow)"/>

<g class="p">
  <rect x="40" y="225" width="220" height="56" rx="8"/>
  <text class="th" x="150" y="246" text-anchor="middle" dominant-baseline="central">La DoD est vraie</text>
  <text class="ts" x="150" y="264" text-anchor="middle" dominant-baseline="central">six points, sans négociation</text>
</g>
<line x1="150" y1="281" x2="150" y2="307" class="arr" marker-end="url(#arrow)"/>

<g class="p">
  <rect x="40" y="315" width="220" height="56" rx="8"/>
  <text class="th" x="150" y="336" text-anchor="middle" dominant-baseline="central">Rétro</text>
  <text class="ts" x="150" y="354" text-anchor="middle" dominant-baseline="central">deux questions, trente minutes</text>
</g>
<line x1="150" y1="371" x2="150" y2="397" class="arr" marker-end="url(#arrow)"/>

<g class="p">
  <rect x="40" y="405" width="220" height="56" rx="8"/>
  <text class="th" x="150" y="426" text-anchor="middle" dominant-baseline="central">data.json puis build</text>
  <text class="ts" x="150" y="444" text-anchor="middle" dominant-baseline="central">et commit</text>
</g>
<path d="M150 461 L22 461 L22 73 L36 73" class="arr" marker-end="url(#arrow)"/>

<rect x="320" y="115" width="320" height="295" rx="12" class="frame"/>
<text class="th" x="345" y="137" dominant-baseline="central">Boucle de session</text>
<line x1="262" y1="183" x2="341" y2="183" class="arr" marker-end="url(#arrow)"/>

<g class="t">
  <rect x="345" y="155" width="270" height="56" rx="8"/>
  <text class="th" x="480" y="176" text-anchor="middle" dominant-baseline="central">Ouverture</text>
  <text class="ts" x="480" y="194" text-anchor="middle" dominant-baseline="central">projet, invariants, data.json, cadrage</text>
</g>
<line x1="480" y1="211" x2="480" y2="229" class="arr" marker-end="url(#arrow)"/>

<g class="t">
  <rect x="345" y="237" width="270" height="56" rx="8"/>
  <text class="th" x="480" y="258" text-anchor="middle" dominant-baseline="central">Travail borné</text>
  <text class="ts" x="480" y="276" text-anchor="middle" dominant-baseline="central">tests du module avant commit</text>
</g>
<line x1="480" y1="293" x2="480" y2="311" class="arr" marker-end="url(#arrow)"/>

<g class="t">
  <rect x="345" y="319" width="270" height="56" rx="8"/>
  <text class="th" x="480" y="340" text-anchor="middle" dominant-baseline="central">Fermeture</text>
  <text class="ts" x="480" y="358" text-anchor="middle" dominant-baseline="central">un statut a bougé ? build. sinon rien</text>
</g>
<path d="M617 347 L629 347 L629 183 L619 183" class="arr" marker-end="url(#arrow)"/>

<line x1="480" y1="410" x2="480" y2="423" class="leader"/>

<g class="a">
  <rect x="320" y="425" width="320" height="56" rx="8"/>
  <text class="th" x="480" y="446" text-anchor="middle" dominant-baseline="central">Une idée arrive en cours de route</text>
  <text class="ts" x="480" y="464" text-anchor="middle" dominant-baseline="central">elle va à l'horizon, jamais en à faire</text>
</g>
</svg>
